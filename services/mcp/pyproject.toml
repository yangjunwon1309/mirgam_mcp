[project]
name = "gemma-mcp-server"
version = "0.1.0"
description = "Read-only DuckDB and Parquet tools for gemma-mcp"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "mcp>=1.2,<2.0",
]

[project.scripts]
gemma-mcp-server = "app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
